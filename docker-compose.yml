services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
        -Djavax.jdo.option.ConnectionUserName=root
        -Djavax.jdo.option.ConnectionPassword=${MYSQL_ROOT_PASSWORD}
    ports:
      - "9083:9083"
    volumes:
      - ./data/warehouse:/opt/hive/data/warehouse
      - ./mysql-connector-java-8.0.28.jar:/opt/hive/lib/mysql-connector-java-8.0.28.jar
    entrypoint: /bin/bash
    command: -c "/entrypoint.sh"

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./模拟数据:/data
      - ./data/warehouse:/opt/hive/data/warehouse
      - ./mysql-connector-java-8.0.28.jar:/opt/hive/lib/mysql-connector-java-8.0.28.jar
    entrypoint: /bin/bash
    command: -c "rm -f /opt/hive/conf/hive-server2.pid /tmp/hive/*.pid /opt/hive/data/*.pid && exec /entrypoint.sh"

  superset:
    image: apache/superset:4.0.0
    container_name: superset
    depends_on:
      mysql:
        condition: service_healthy
      hive-server:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "change_me_random_string"
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
      SUPERSET_DB_URI: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/superset?charset=utf8mb4"
    volumes:
      - ./superset_home:/app/superset_home
      - ./superset_config.py:/app/superset_config.py
    command: >
      /bin/sh -c "
      pip install 'pyhive[presto]' mysqlclient &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin123 || true &&
      superset init &&
      superset run -p 8088 --host 0.0.0.0 --with-threads --reload --debugger
      "

volumes:
  mysql_data: